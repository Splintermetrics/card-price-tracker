name: Capture market history

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture official market data
        run: node scripts/capture-history.mjs
      - name: Save snapshot
        shell: bash
        run: |
          git config user.name "market-watch-bot"
          git config user.email "market-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Capture daily market snapshot"
          git push

